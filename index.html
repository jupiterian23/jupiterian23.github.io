<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Shubham R Gorule — AWS Cloud Support Engineer</title>
        <meta
            name="description"
            content="Shubham R Gorule, Mumbai. AWS, Linux and networking. Building and diagnosing cloud infrastructure. Open to Cloud Support Engineer roles."
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
        <style>
            :root {
                --ink: #080f17;
                --deep: #0c1926;
                --raise: #102437;
                --rule: #1b3348;
                --line: #2e5c7a;
                --text: #e8f2fa;
                --muted: #93b2c9;
                --dim: #6b8ca5;
                --amber: #e8a33d;
                --amber-dim: #8a6526;
                --ok: #5fb49c;
                --mono: "IBM Plex Mono", ui-monospace, monospace;
                --sans: "Space Grotesk", system-ui, sans-serif;
            }
            * {
                box-sizing: border-box;
            }
            html {
                scroll-behavior: smooth;
            }
            @media (prefers-reduced-motion: reduce) {
                html {
                    scroll-behavior: auto;
                }
            }
            body {
                margin: 0;
                background: var(--ink);
                color: var(--text);
                font-family: var(--sans);
                font-size: 16.5px;
                line-height: 1.62;
                -webkit-font-smoothing: antialiased;
                overflow-x: hidden;
            }
            /* faint scan texture — restraint: very low opacity, no animation */
            body::after {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 60;
                background: repeating-linear-gradient(180deg, rgba(232, 163, 61, 0.018) 0 1px, transparent 1px 3px);
            }
            a {
                color: inherit;
            }
            a:focus-visible,
            button:focus-visible,
            input:focus-visible {
                outline: 2px solid var(--amber);
                outline-offset: 3px;
                border-radius: 2px;
            }
            .wrap {
                max-width: 1120px;
                margin: 0 auto;
                padding: 0 24px;
            }

            /* ---------- boot ---------- */
            #boot {
                position: fixed;
                inset: 0;
                z-index: 100;
                background: var(--ink);
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: var(--mono);
                font-size: 13.5px;
                color: var(--ok);
                transition: opacity 0.5s ease;
            }
            #boot.done {
                opacity: 0;
                pointer-events: none;
            }
            #boot .lines {
                width: min(560px, 88vw);
                white-space: pre-wrap;
            }
            #boot .ln {
                opacity: 0.9;
            }
            #boot .tag {
                color: var(--dim);
            }

            /* ---------- hud frame ---------- */
            .hudbar {
                position: sticky;
                top: 0;
                z-index: 50;
                background: rgba(8, 15, 23, 0.9);
                backdrop-filter: blur(8px);
                border-bottom: 1px solid var(--rule);
                font-family: var(--mono);
                font-size: 12.5px;
                color: var(--dim);
            }
            .hudbar .wrap {
                display: flex;
                align-items: center;
                gap: 20px;
                height: 44px;
            }
            .hudbar .id {
                color: var(--amber);
                letter-spacing: 0.06em;
            }
            .hudbar nav {
                margin-left: auto;
                display: flex;
                gap: 18px;
            }
            .hudbar nav a {
                text-decoration: none;
                transition: color 0.15s;
            }
            .hudbar nav a:hover {
                color: var(--text);
            }
            @media (max-width: 760px) {
                .hudbar nav {
                    display: none;
                }
            }

            /* ---------- hero ---------- */
            header {
                padding: 72px 0 40px;
                position: relative;
            }
            .bracket {
                position: relative;
                padding: 34px 30px;
            }
            .bracket::before,
            .bracket::after {
                content: "";
                position: absolute;
                width: 22px;
                height: 22px;
                border: 1px solid var(--amber);
                opacity: 0.55;
            }
            .bracket::before {
                top: 0;
                left: 0;
                border-right: 0;
                border-bottom: 0;
            }
            .bracket::after {
                bottom: 0;
                right: 0;
                border-left: 0;
                border-top: 0;
            }
            .eyebrow {
                font-family: var(--mono);
                font-size: 12.5px;
                color: var(--dim);
                display: flex;
                align-items: center;
                gap: 9px;
                margin-bottom: 16px;
            }
            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--amber);
                flex: none;
            }
            @media (prefers-reduced-motion: no-preference) {
                .dot {
                    animation: pulse 2.6s ease-in-out infinite;
                }
                @keyframes pulse {
                    0%,
                    100% {
                        box-shadow: 0 0 0 0 rgba(232, 163, 61, 0.5);
                    }
                    50% {
                        box-shadow: 0 0 0 7px rgba(232, 163, 61, 0);
                    }
                }
            }
            h1 {
                font-size: clamp(2.3rem, 6.4vw, 4.2rem);
                line-height: 1.02;
                margin: 0 0 16px;
                letter-spacing: -0.025em;
            }
            .lede {
                font-size: clamp(1.02rem, 2.1vw, 1.24rem);
                color: var(--muted);
                max-width: 54ch;
                margin: 0 0 30px;
            }
            .lede b {
                color: var(--text);
                font-weight: 500;
            }
            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 11px;
            }
            .btn {
                display: inline-block;
                text-decoration: none;
                font-family: var(--mono);
                font-size: 13.5px;
                padding: 10px 18px;
                border: 1px solid var(--rule);
                color: var(--muted);
                transition:
                    border-color 0.16s,
                    color 0.16s,
                    background 0.16s;
            }
            .btn:hover {
                border-color: var(--amber);
                color: var(--amber);
                background: rgba(232, 163, 61, 0.05);
            }
            .btn-key {
                background: var(--amber);
                border-color: var(--amber);
                color: #150f04;
                font-weight: 600;
            }
            .btn-key:hover {
                background: #f2b25c;
                border-color: #f2b25c;
                color: #150f04;
            }

            /* trace */
            .trace {
                width: 100%;
                height: 110px;
                margin-top: 44px;
                display: block;
                overflow: visible;
            }
            .trace path {
                fill: none;
                stroke: var(--line);
                stroke-width: 1.8;
                stroke-linejoin: round;
                stroke-linecap: round;
            }
            @media (prefers-reduced-motion: no-preference) {
                .trace path {
                    stroke-dasharray: 1500;
                    stroke-dashoffset: 1500;
                    animation: draw 2.4s cubic-bezier(0.5, 0, 0.2, 1) 0.2s forwards;
                }
                @keyframes draw {
                    to {
                        stroke-dashoffset: 0;
                    }
                }
                .trace circle {
                    opacity: 0;
                    animation: show 0.45s ease 2.3s forwards;
                }
                @keyframes show {
                    to {
                        opacity: 1;
                    }
                }
            }
            .tracelab {
                font-family: var(--mono);
                font-size: 12px;
                color: var(--dim);
                margin-top: 0;
            }

            /* ---------- terminal ---------- */
            .term {
                border: 1px solid var(--rule);
                background: linear-gradient(180deg, var(--deep), var(--ink));
                font-family: var(--mono);
                font-size: 13.5px;
            }
            .term-top {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 9px 14px;
                border-bottom: 1px solid var(--rule);
                color: var(--dim);
                font-size: 12px;
            }
            .term-top .pip {
                width: 9px;
                height: 9px;
                border-radius: 50%;
                background: var(--rule);
            }
            .term-top .pip.on {
                background: var(--ok);
            }
            .term-body {
                padding: 16px;
                height: 340px;
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: var(--rule) transparent;
            }
            .term-body::-webkit-scrollbar {
                width: 8px;
            }
            .term-body::-webkit-scrollbar-thumb {
                background: var(--rule);
            }
            .term-line {
                white-space: pre-wrap;
                word-break: break-word;
                margin: 0 0 3px;
                color: var(--muted);
            }
            .term-line.cmd {
                color: var(--text);
            }
            .term-line.ok {
                color: var(--ok);
            }
            .term-line.warn {
                color: var(--amber);
            }
            .term-line.dim {
                color: var(--dim);
            }
            .term-in {
                display: flex;
                align-items: center;
                gap: 9px;
                border-top: 1px solid var(--rule);
                padding: 11px 16px;
            }
            .term-in span {
                color: var(--amber);
                flex: none;
            }
            .term-in input {
                flex: 1;
                background: transparent;
                border: 0;
                outline: none;
                color: var(--text);
                font-family: var(--mono);
                font-size: 13.5px;
                min-width: 0;
            }
            .chips {
                display: flex;
                flex-wrap: wrap;
                gap: 7px;
                margin-top: 12px;
            }
            .chip {
                font-family: var(--mono);
                font-size: 12px;
                padding: 5px 11px;
                cursor: pointer;
                background: transparent;
                border: 1px solid var(--rule);
                color: var(--dim);
                transition:
                    color 0.15s,
                    border-color 0.15s;
            }
            .chip:hover {
                color: var(--amber);
                border-color: var(--amber);
            }

            /* ---------- sections ---------- */
            section {
                padding: 70px 0;
                border-top: 1px solid var(--rule);
            }
            h2 {
                font-family: var(--mono);
                font-size: 13px;
                font-weight: 500;
                color: var(--amber);
                letter-spacing: 0.08em;
                margin: 0 0 30px;
                display: flex;
                align-items: center;
                gap: 12px;
            }
            h2::after {
                content: "";
                height: 1px;
                flex: 1;
                background: var(--rule);
            }
            h3 {
                font-size: 1.18rem;
                margin: 0 0 6px;
                font-weight: 500;
                letter-spacing: -0.01em;
            }
            p {
                max-width: 68ch;
            }
            .prose {
                color: var(--muted);
                font-size: 1.04rem;
            }
            .prose b {
                color: var(--text);
                font-weight: 500;
            }
            code {
                font-family: var(--mono);
                font-size: 0.9em;
                color: var(--amber);
                background: rgba(232, 163, 61, 0.07);
                padding: 1px 5px;
            }

            .grid2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 26px;
            }
            @media (max-width: 820px) {
                .grid2 {
                    grid-template-columns: 1fr;
                }
            }

            /* skills readout */
            .skill {
                border-top: 1px solid var(--rule);
                padding: 15px 0;
                display: grid;
                grid-template-columns: 104px 1fr;
                gap: 20px;
            }
            .skill:last-child {
                border-bottom: 1px solid var(--rule);
            }
            .skill dt {
                font-family: var(--mono);
                font-size: 12.5px;
                color: var(--ok);
                letter-spacing: 0.04em;
                padding-top: 4px;
            }
            .skill dd {
                margin: 0;
                color: var(--muted);
                font-size: 0.97rem;
            }
            .skill dd b {
                display: block;
                color: var(--text);
                font-weight: 500;
                font-size: 1.02rem;
                margin-bottom: 2px;
            }
            @media (max-width: 600px) {
                .skill {
                    grid-template-columns: 1fr;
                    gap: 4px;
                }
            }

            /* project entries */
            .entry {
                border-top: 1px solid var(--rule);
                padding: 28px 0;
            }
            .entry:first-of-type {
                border-top: none;
                padding-top: 0;
            }
            .ehead {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                gap: 14px;
                margin-bottom: 14px;
            }
            .ehead h3 {
                margin: 0;
            }
            .repo {
                font-family: var(--mono);
                font-size: 12.5px;
                color: var(--dim);
                text-decoration: none;
                border-bottom: 1px solid var(--rule);
            }
            .repo:hover {
                color: var(--amber);
                border-color: var(--amber);
            }
            .fld {
                display: grid;
                grid-template-columns: 92px 1fr;
                gap: 18px;
                margin-bottom: 10px;
            }
            .fld dt {
                font-family: var(--mono);
                font-size: 12px;
                color: var(--dim);
                letter-spacing: 0.04em;
                padding-top: 3px;
            }
            .fld dd {
                margin: 0;
                color: var(--muted);
                max-width: 62ch;
            }
            @media (max-width: 600px) {
                .fld {
                    grid-template-columns: 1fr;
                    gap: 2px;
                    margin-bottom: 13px;
                }
            }
            .stack {
                font-family: var(--mono);
                font-size: 12px;
                color: var(--dim);
                margin-top: 13px;
            }
            .note {
                font-size: 0.89rem;
                color: var(--dim);
                border-left: 2px solid var(--rule);
                padding-left: 13px;
                margin-top: 15px;
                max-width: 60ch;
            }

            /* timeline */
            .role {
                display: grid;
                grid-template-columns: 128px 1fr;
                gap: 24px;
                padding: 20px 0;
                border-top: 1px solid var(--rule);
            }
            .role:last-child {
                border-bottom: 1px solid var(--rule);
            }
            .when {
                font-family: var(--mono);
                font-size: 12.5px;
                color: var(--dim);
                padding-top: 4px;
            }
            .role p {
                margin: 5px 0 0;
                color: var(--muted);
                font-size: 0.97rem;
            }
            @media (max-width: 600px) {
                .role {
                    grid-template-columns: 1fr;
                    gap: 3px;
                }
            }

            footer {
                padding: 70px 0 80px;
                border-top: 1px solid var(--rule);
            }
            .contact {
                display: flex;
                flex-wrap: wrap;
                gap: 13px 36px;
                margin-top: 24px;
            }
            .contact a {
                font-family: var(--mono);
                font-size: 14px;
                color: var(--muted);
                text-decoration: none;
                border-bottom: 1px solid var(--rule);
                padding-bottom: 2px;
            }
            .contact a:hover {
                color: var(--amber);
                border-color: var(--amber);
            }
            .colophon {
                margin-top: 50px;
                font-family: var(--mono);
                font-size: 12px;
                color: var(--dim);
            }
        </style>
    </head>
    <body>
        <div id="boot" aria-hidden="true"><div class="lines" id="bootlines"></div></div>
        <div id="root"></div>

            function Terminal() {
                const start = [
                    ["dim", "Type a command, or tap one below. 'help' lists everything."],
                    ["ok", "Last login: today. Session ready."],
                ];
                const [lines, setLines] = useState(start);
                const [val, setVal] = useState("");
                const [hist, setHist] = useState([]);
                const [hi, setHi] = useState(-1);
                const bodyRef = useRef(null);
                const inRef = useRef(null);

                useEffect(() => {
                    const el = bodyRef.current;
                    if (el) el.scrollTop = el.scrollHeight;
                }, [lines]);

                function run(raw) {
                    const cmd = raw.trim().toLowerCase();
                    if (!cmd) return;
                    setHist((h) => [cmd, ...h]);
                    setHi(-1);
                    if (cmd === "clear") {
                        setLines([]);
                        return;
                    }
                    const fn = COMMANDS[cmd];
                    const out = fn
                        ? fn()
                        : [
                              ["warn", "command not found: " + cmd],
                              ["dim", "try 'help'"],
                          ];
                    setLines((l) => [...l, ["cmd", "$ " + cmd], ...out, ["", ""]]);
                }

                function onKey(e) {
                    if (e.key === "Enter") {
                        run(val);
                        setVal("");
                    } else if (e.key === "ArrowUp") {
                        e.preventDefault();
                        if (hist.length) {
                            const n = Math.min(hi + 1, hist.length - 1);
                            setHi(n);
                            setVal(hist[n]);
                        }
                    } else if (e.key === "ArrowDown") {
                        e.preventDefault();
                        const n = hi - 1;
                        if (n < 0) {
                            setHi(-1);
                            setVal("");
                        } else {
                            setHi(n);
                            setVal(hist[n]);
                        }
                    }
                }

                const quick = ["whoami", "skills", "projects", "contact", "uptime", "help"];

                return (
                    <div>
                        <div className="term">
                            <div className="term-top">
                                <span className="pip on"></span>
                                <span className="pip"></span>
                                <span className="pip"></span>

                            </div>
                            <div
                                className="term-body"
                                ref={bodyRef}
                                onClick={() => inRef.current && inRef.current.focus()}
                            >
                                {lines.map((l, i) => (
                                    <p key={i} className={"term-line " + (l[0] || "")}>
                                        {l[1] || "\u00A0"}
                                    </p>
                                ))}
                            </div>
                            <div className="term-in">
                                <span>$</span>
                                <input
                                    ref={inRef}
                                    value={val}
                                    onChange={(e) => setVal(e.target.value)}
                                    onKeyDown={onKey}
                                    placeholder="type a command…"
                                    aria-label="Terminal command input"
                                    autoComplete="off"
                                    spellCheck="false"
                                />
                            </div>
                        </div>
                        <div className="chips">
                            {quick.map((c) => (
                                <button key={c} className="chip" onClick={() => run(c)}>
                                    {c}
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }

        <script>
            /* boot sequence — one orchestrated moment, then it never runs again */
            (function () {
                var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
                var boot = document.getElementById("boot");
                var box = document.getElementById("bootlines");
                var seq = [
                    "initialising session…",
                    "region        ap-south-1 (mumbai)",
                    "checking      linux · networking · aws",
                    "profile       shubham r gorule",
                    "status        open to cloud support roles",
                    "ready.",
                ];
                function finish() {
                    boot.classList.add("done");
                    setTimeout(function () {
                        boot.remove();
                    }, 600);
                }
                if (reduce) {
                    finish();
                    return;
                }
                var i = 0;
                (function step() {
                    if (i >= seq.length) {
                        setTimeout(finish, 420);
                        return;
                    }
                    var d = document.createElement("div");
                    d.className = "ln";
                    d.textContent = (i === seq.length - 1 ? "" : "[ ok ] ") + seq[i];
                    box.appendChild(d);
                    i++;
                    setTimeout(step, i === 1 ? 260 : 150);
                })();
                setTimeout(finish, 3200); /* hard failsafe */
            })();
        </script>
